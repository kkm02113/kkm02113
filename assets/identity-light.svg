<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="440" viewBox="0 0 1220 440" role="img" aria-labelledby="title desc">
  <title id="title">Kangmin Kim — The Last Mile of AI</title>
  <desc id="desc">An original field-notes-inspired visual for applied AI and backend engineering. A four-step system illustrates evidence, structuring, validation, and human review.</desc>
